name: Watch the feed

# Goes red when the feed stops being refreshed.
#
# Every other check on this data runs inside the producer's own run, so each
# of them needs that run to happen. One that never starts - a schedule GitHub
# has stopped firing, a disabled workflow - or one that cannot run at all, as
# every run with the Actions allowance spent (marked failed within seconds,
# having run nothing), or a run that passes while unable to write here, checks
# nothing; the data simply sits, correctly signed and getting older. This lives here rather
# than beside the producer for that reason: it has to keep working when the
# producer does not, and a public repository's runs cost it nothing.
#
# It reads the files in this repository, which is what the app reads, and
# holds the key fingerprint the README publishes to the key beside them.
#
# Two ages, because a producer can stop in two ways. The whole thing can stop
# - nothing runs, so checked.json stops moving. Or the quick runs can go on
# while the daily board sweep does not - a sweep schedule GitHub stops firing,
# or a vendor whose every sweep fails - which leaves checked.json current and
# the board sections getting older. The producer's own freshness gate turns
# its runs red for that, but only its runs, and only if somebody looks at them.
# Each section is measured as that gate measures it - against `checked`, the
# producer's last run - so the two agree, and a producer that has stopped
# altogether is reported as that alone rather than as every section at once.
on:
  schedule:
    # Four times a day, between the producer's own slots. Odd minutes on
    # purpose: GitHub delays, and sometimes drops, jobs scheduled on the hour.
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-feed
  cancel-in-progress: true

jobs:
  watch:
    # Pinned, as the producer is: ubuntu-latest moves to Ubuntu 26 from
    # 2026-10-19, and this is the job that has to keep working when nobody is
    # looking.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The feed was checked recently, every section is current, it still verifies, and the README names its key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The producer writes checked.json on every run, six hours apart.
          # Measured on 2026-10-17 over every `checked` this repository has
          # published (261 runs, 2026-08-28 to 2026-10-17): the gap between
          # them had a median of 4.5 hours, a 95th percentile of 8.4, and,
          # outside the one outage (24.1 hours from 2026-09-23, the Actions
          # allowance spent), never passed 12.0. Twelve is new since the
          # last measurement (8.4, to 2026-09-21): in October GitHub started
          # no run at all for a scheduled slot several times, and a dropped
          # slot with the next one late made gaps of 9 to 12 hours.
          # Twenty-four is twice that, so it cannot fire on a slow or
          # skipped cron. The cost is reach: this job's own runs have come
          # up to about twelve hours apart, so a real stop is reported a day
          # to a day and a half after the last check, and a stop that ends
          # within about a day may not be reported at all: the 2026-09-23
          # one went red at eighteen (20.4 hours, 08:29 the next morning),
          # but no run of this job fell in the six minutes it spent past
          # twenty-four.
          $maxAgeHours = 24

          # Each section's own stamp against `checked`, with the limit and the
          # rounding the producer's freshness gate uses. A board vendor is
          # swept daily with an evening second chance, so two and a half days
          # is two days of both missed. Under the app's three on purpose: the
          # app measures against the moment it looks, this only at `checked`,
          # and at three the app's About page could turn amber before this
          # went red. Measured on 2026-10-17 over the same 261 runs: since the
          # daily sweep began (2026-09-25) no section has been more than 1.4
          # days behind `checked` except ASUS from 2026-10-15 (2.7 to 2.9
          # days, its BIOS API answering FAIL for every board), which this
          # caught.
          $maxSectionAgeDays = 2.5

          function Test-Signature([string] $file, [string] $signatureFile) {
            $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
            try {
              $read = 0
              $key = (Get-Content feed/public-key.txt -Raw).Trim()
              $ecdsa.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($key), [ref] $read)
              return $ecdsa.VerifyData(
                [System.IO.File]::ReadAllBytes((Resolve-Path $file)),
                [Convert]::FromBase64String((Get-Content $signatureFile -Raw).Trim()),
                [System.Security.Cryptography.HashAlgorithmName]::SHA256)
            }
            finally {
              $ecdsa.Dispose()
            }
          }

          $problems = @()

          foreach ($pair in @(
              @{ File = 'feed/updates.json'; Signature = 'feed/updates.sig' }
              @{ File = 'feed/checked.json'; Signature = 'feed/checked.sig' })) {
            if (-not (Test-Path $pair.File) -or -not (Test-Path $pair.Signature)) {
              $problems += "$($pair.File) or its signature is missing."
            }
            elseif (-not (Test-Signature $pair.File $pair.Signature)) {
              $problems += "$($pair.File) does not verify against feed/public-key.txt."
            }
          }

          # The README publishes the key's SHA-256 fingerprint for anyone
          # checking a key they obtained some other way. The checks above
          # verify against feed/public-key.txt itself, so they would pass on
          # a key replaced together with files re-signed under it; the
          # README's figure is the one thing here that names the key on its
          # own. It is also kept by hand, and a key rotation that forgets it
          # leaves the README contradicting the real key. Computed the way
          # the README says, and the way Rotate-FeedSigningKey.ps1 prints it:
          # SHA-256 over the SubjectPublicKeyInfo DER that public-key.txt
          # decodes to, not over the text file, in lowercase hex. The figure
          # is the first fenced block after the words "SHA-256 fingerprint".
          if (-not (Test-Path feed/public-key.txt)) {
            $problems += "feed/public-key.txt is missing."
          }
          else {
            $readme = Get-Content README.md -Raw
            $block = [regex]::Match($readme, '(?s)SHA-256 fingerprint.*?\n```[^\n]*\n(?<value>(?:[^\n]*\n)*?)```')
            $readmeFingerprint = $block.Groups['value'].Value.Trim()
            $keyFingerprint = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData(
                [Convert]::FromBase64String((Get-Content feed/public-key.txt -Raw).Trim()))).ToLowerInvariant()
            if ($readmeFingerprint -notmatch '^[0-9a-fA-F]{64}$') {
              $problems += "README.md gives no readable SHA-256 fingerprint for the feed's public key ('$readmeFingerprint')."
            }
            elseif ($readmeFingerprint.ToLowerInvariant() -ne $keyFingerprint) {
              $problems += ("README.md gives the public key's SHA-256 fingerprint as {0}, but feed/public-key.txt's is {1}. " +
                'Either the key was rotated and the README was not, or the key here is not the one the README vouches for: ' +
                'compare it with the copy the app ships (Data/feed-public-key.txt) before changing either.') -f $readmeFingerprint, $keyFingerprint
            }
            else {
              $line = "Public key fingerprint $keyFingerprint matches the README."
              Write-Host $line
              $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          }

          if (Test-Path feed/checked.json) {
            # Read as text: ConvertFrom-Json turns a timestamp into a DateTime
            # in the runner's culture, and this comparison should not depend
            # on what that happens to be.
            $text = Get-Content feed/checked.json -Raw
            $stamp = [regex]::Match($text, '"checked"\s*:\s*"(?<value>[^"]+)"').Groups['value'].Value
            $checked = [datetimeoffset]::MinValue
            $styles = [System.Globalization.DateTimeStyles]'AssumeUniversal, AdjustToUniversal'
            if (-not [datetimeoffset]::TryParse($stamp, [cultureinfo]::InvariantCulture, $styles, [ref] $checked)) {
              $problems += "feed/checked.json has no readable 'checked' time ('$stamp')."
            }
            else {
              $age = [datetimeoffset]::UtcNow - $checked
              $line = 'Last checked {0:yyyy-MM-dd HH:mm} UTC, {1:N1} hours ago (limit {2}).' -f $checked, $age.TotalHours, $maxAgeHours
              Write-Host $line
              $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
              if ($age.TotalHours -gt $maxAgeHours) {
                $problems += ('The feed was last checked {0:N1} hours ago; the producer runs every six. ' +
                  'It has stopped running, or it can no longer publish here.') -f $age.TotalHours
              }
            }

            # The same reading, per section. Pulled out one pair at a time
            # for the same reason as above: no DateTime conversion.
            $freshnessBlock = [regex]::Match($text, '"freshness"\s*:\s*\{(?<body>[^}]*)\}').Groups['body'].Value
            $sections = [regex]::Matches($freshnessBlock, '"(?<name>[^"]+)"\s*:\s*"(?<value>[^"]+)"')
            if ($sections.Count -eq 0) {
              $problems += "feed/checked.json has no section freshness to read."
            }
            foreach ($section in $sections) {
              $name = $section.Groups['name'].Value
              $stamped = [datetimeoffset]::MinValue
              if (-not [datetimeoffset]::TryParse($section.Groups['value'].Value, [cultureinfo]::InvariantCulture, $styles, [ref] $stamped)) {
                $problems += "feed/checked.json has no readable time for $name ('$($section.Groups['value'].Value)')."
                continue
              }
              # No `checked` to measure against is already reported above.
              if ($checked -eq [datetimeoffset]::MinValue) { continue }
              $sectionAgeDays = [Math]::Round(($checked - $stamped).TotalDays, 1)
              if ($sectionAgeDays -gt $maxSectionAgeDays) {
                $problems += ('{0} was last refreshed {1:yyyy-MM-dd HH:mm} UTC, {2:N1} days before the last check (limit {3}). ' +
                  'The producer is running but no longer refreshing it.') -f $name, $stamped, $sectionAgeDays, $maxSectionAgeDays
              }
            }
            $oldest = $sections | Sort-Object { $_.Groups['value'].Value } | Select-Object -First 1
            if ($oldest) {
              $line = 'Oldest section: {0}, refreshed {1}.' -f $oldest.Groups['name'].Value, $oldest.Groups['value'].Value
              Write-Host $line
              $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          }

          if ($problems.Count -gt 0) {
            foreach ($problem in $problems) {
              Write-Host "::error::$problem"
              "- $problem" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
            exit 1
          }
